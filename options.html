<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TranslateFlow 设置</title>
  <link rel="stylesheet" href="src/ui/styles/tokens.css" />
  <link rel="stylesheet" href="src/ui/styles/components.css" />
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/options/main.tsx"></script>
  <!-- #252 replaces these two controller-owned compatibility islands. React
       copies only their children into stable section containers, then removes
       this inert template before any controller is mounted. -->
  <template id="legacy-options-source">
    <section id="glossary" tabindex="-1">
      <h2>术语表</h2>
      <p class="hint">全局术语应用于所有网页；站点术语仅应用于指定 Origin，并可覆盖同名全局术语。</p>
      <div class="profile-grid">
        <div><label for="glossaryScope">作用范围</label><select id="glossaryScope"><option value="global">全局</option><option value="site">指定站点</option></select></div>
        <div><label for="glossaryOrigin">站点 Origin</label><input id="glossaryOrigin" type="text" placeholder="https://github.com" disabled /></div>
      </div>
      <div class="profile-grid">
        <div><label for="glossarySource">来源术语</label><input id="glossarySource" type="text" placeholder="pull request" /></div>
        <div><label for="glossaryTarget">目标译法</label><input id="glossaryTarget" type="text" placeholder="拉取请求" /></div>
      </div>
      <div class="inline-checks">
        <label class="checkbox-label"><input id="glossaryCaseSensitive" type="checkbox" />区分大小写</label>
        <label class="checkbox-label"><input id="glossaryEnabled" type="checkbox" checked />启用</label>
      </div>
      <div class="actions"><button id="saveGlossaryEntry" class="primary">保存术语</button><button id="clearGlossaryEditor">清空编辑器</button></div>
      <div id="glossaryList" class="site-list">正在读取术语表…</div>
      <p class="hint">修改、停用或删除有效术语会生成新的相关缓存版本；空术语表保持旧缓存兼容。</p>
    </section>

    <section id="dictionary-packs" tabindex="-1">
      <h2>词典库</h2>
      <p class="section-summary">本地查词始终优先于 AI。内置词典随扩展提供；下载词典和本地导入只会在你主动操作后保存到浏览器中。</p>
      <div class="dictionary-library-group" aria-labelledby="dictionaryBuiltInHeading">
        <h3 id="dictionaryBuiltInHeading">内置词典</h3>
        <p class="hint">随扩展提供的小型离线词典。这里显示版本、记录数和健康状态。</p>
        <div id="bundledLexiconList" class="site-list dictionary-health-list" aria-live="polite">正在检查内置词典…</div>
        <details class="dictionary-repair-help"><summary>源码开发安装修复说明</summary><p>从源码加载扩展时，真实词典资源不会提交到 Git。若状态显示资源缺失，请运行 <code>npm run setup:lexicon</code>，完成后在 <code>chrome://extensions</code> 重新加载扩展。</p></details>
      </div>
      <div class="dictionary-library-group" aria-labelledby="dictionaryDownloadHeading">
        <h3 id="dictionaryDownloadHeading">精选上游与官方词典</h3>
        <p class="hint">每项会分别标示上游版本、词典内容日期、TranslateFlow 兼容性审核与下载大小。下载只在你主动操作后进行。</p>
        <h4>官方词典</h4><p class="hint">只有通过来源、再分发许可、质量审核与发布签名的词典才会标为官方。当前没有符合条件的官方词典。</p>
        <div id="dictionaryPacksList" class="site-list" aria-live="polite">正在读取官方词典状态…</div>
        <h4>精选上游</h4><p class="hint">直接从固定的上游版本下载，并由 TranslateFlow 在本机按审核规则转换。内容属于上游 / 社区，不代表 TranslateFlow 官方背书或重新授权。</p>
        <div id="curatedDictionaryList" class="site-list" aria-live="polite">正在读取精选上游词典状态…</div>
        <div class="actions"><button id="refreshDictionaryPacks" type="button">重新检查词典状态</button></div>
        <p class="hint">下载或更新失败不会替换最后一个健康版本；文件缺失、损坏和版本不兼容会显示为不同状态。</p>
      </div>
      <div class="dictionary-library-group" aria-labelledby="dictionaryInstalledHeading">
        <h3 id="dictionaryInstalledHeading">已安装</h3>
        <p class="hint">这里列出已安装的额外词典，包含来源、兼容状态、本地版本、占用空间和管理操作。</p>
        <h4>词典包与本地词典</h4><div id="installedDictionaryList" class="site-list" aria-live="polite">正在读取已安装词典…</div>
        <h4>富文本词典</h4><p class="hint">划词展示顺序中第一本已启用的富文本词典是你的个人首选，并会优先展开。你可以随时调整；这只是个人显示偏好，不代表 TranslateFlow 的推荐或官方背书。</p>
        <div id="richMdictInstalledList" class="site-list" aria-live="polite">正在读取已安装的富文本词典…</div>
      </div>
      <div class="dictionary-library-group" aria-labelledby="dictionaryImportHeading">
        <h3 id="dictionaryImportHeading">本地导入</h3>
        <p class="hint">本地文件按不可信数据处理；导入不会赋予或暗示任何再分发权利，也不会自动调用 Provider / AI。</p>
        <div id="localDictionaryImport" class="data-source-card local-dictionary-import" data-status="empty">
          <strong>从本地文件添加词典</strong><p>选择或拖入一套词典文件。TranslateFlow 会在本机检查格式并说明可用方式；格式本身不会证明词典的语义方向或来源。</p>
          <label id="localDictionaryDropZone" class="local-dictionary-drop-zone" for="localDictionaryFiles" tabindex="0"><span>拖放文件到这里，或选择文件</span><small>支持 MDX / MDD、StarDict、TranslateFlow TFLex 文件；文件只在本机处理</small></label>
          <input id="localDictionaryFiles" class="visually-hidden-file-input" type="file" multiple accept=".mdx,.mdd,.ifo,.idx,.dict,.dict.dz,.syn,.json,.dat" aria-describedby="localDictionaryHelp" />
          <p id="localDictionaryHelp" class="hint">可一次选择 MDX 与同名 MDD、编号 MDD，或同名 StarDict 文件组。TFLex 导入会由安装流程重新校验完整文件与记录。</p>
          <ul id="localDictionaryFileList" class="local-dictionary-file-list" aria-label="已选择的词典文件"></ul>
          <div class="actions"><button id="localDictionaryChooseFiles" type="button">选择 / 重新选择文件</button><button id="localDictionaryClearFiles" type="button" disabled>清空文件</button></div>
          <section id="localDictionaryPreflight" class="local-dictionary-preflight" aria-labelledby="localDictionaryPreflightHeading" hidden>
            <h4 id="localDictionaryPreflightHeading">本机兼容性检查</h4><div id="localDictionaryPreflightSummary" class="local-dictionary-preflight-summary" aria-live="polite"></div>
            <label id="localDictionarySemanticLabel" class="checkbox-label" for="localDictionarySemanticConfirmation" hidden><input id="localDictionarySemanticConfirmation" type="checkbox" disabled /><span id="localDictionarySemanticText"></span></label>
            <label id="localDictionaryLimitationsLabel" class="checkbox-label" for="localDictionaryLimitationsConfirmation" hidden><input id="localDictionaryLimitationsConfirmation" type="checkbox" disabled /><span id="localDictionaryLimitationsText">我已阅读上述兼容说明，仍按显示的安装方式继续。</span></label>
            <label id="localDictionaryDuplicateLabel" class="checkbox-label" for="localDictionaryDuplicateConfirmation" hidden><input id="localDictionaryDuplicateConfirmation" type="checkbox" disabled /><span id="localDictionaryDuplicateText"></span></label>
            <div class="actions"><button id="localDictionaryImportButton" class="primary" type="button" disabled>安装词典</button><button id="localDictionaryCancelButton" type="button" hidden>取消</button><button id="localDictionaryRetryMddButton" type="button" hidden>重试添加 MDD</button></div>
            <p id="localDictionaryImportProgress" class="hint" aria-live="polite"></p>
          </section>
        </div>
      </div>
    </section>
  </template>
</body>
</html>
