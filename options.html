<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>TranslateFlow 设置</title><link rel="stylesheet" href="options.css" /></head><body><main>
<h1>TranslateFlow</h1><p class="lead">支持 DeepSeek 与 OpenAI-compatible Provider；全局配置、站点覆盖和术语表都会参与有效翻译配置。</p>
<section><h2>默认翻译配置</h2><label for="defaultProvider">默认 Provider</label><select id="defaultProvider"><option value="deepseek">DeepSeek</option><option value="openai-compatible">OpenAI-compatible</option></select><label for="prompt">默认翻译 Prompt</label><textarea id="prompt" rows="10"></textarea><p class="hint">站点级 Prompt 留空时继承这里。</p><label for="targetLanguage">默认目标语言</label><input id="targetLanguage" type="text" placeholder="Simplified Chinese" /></section>
<section><h2>DeepSeek</h2><label for="deepseekApiKey">API Key</label><div class="password-row"><input id="deepseekApiKey" type="password" autocomplete="off" placeholder="sk-..." /><button id="revealDeepSeek" type="button">显示</button></div><label for="deepseekModel">模型</label><input id="deepseekModel" type="text" value="deepseek-flash" /></section>
<section><h2>OpenAI-compatible</h2><label for="openaiBaseUrl">Base URL</label><input id="openaiBaseUrl" type="url" placeholder="https://api.openai.com/v1" /><label for="openaiApiKey">API Key</label><div class="password-row"><input id="openaiApiKey" type="password" autocomplete="off" placeholder="可选；本地模型可留空" /><button id="revealOpenAI" type="button">显示</button></div><label for="openaiModel">模型</label><input id="openaiModel" type="text" placeholder="gpt-4.1-mini / qwen / local-model ..." /></section>
<section><h2>站点级覆盖</h2><div class="profile-grid"><div><label for="siteOrigin">站点</label><input id="siteOrigin" type="text" placeholder="https://github.com" /></div><div><label for="siteProvider">Provider</label><select id="siteProvider"><option value="">继承默认</option><option value="deepseek">DeepSeek</option><option value="openai-compatible">OpenAI-compatible</option></select></div></div><label for="siteModel">模型覆盖</label><input id="siteModel" type="text" /><label for="sitePrompt">Prompt 覆盖</label><textarea id="sitePrompt" rows="6"></textarea><label for="siteTargetLanguage">目标语言覆盖</label><input id="siteTargetLanguage" type="text" /><div class="actions"><button id="saveSiteProfile" class="primary">保存站点配置</button><button id="clearSiteEditor">清空编辑器</button></div><div id="siteProfilesList" class="site-list">正在读取站点配置…</div></section>
<section><h2>术语表</h2><p class="hint">全局术语用于所有网页；站点术语扩展全局术语，并可覆盖同一来源词。修改有效术语会形成新的缓存身份。</p><div class="profile-grid"><div><label for="glossaryScope">范围</label><select id="glossaryScope"><option value="global">全局</option><option value="site">指定站点</option></select></div><div><label for="glossaryOrigin">站点</label><input id="glossaryOrigin" type="text" placeholder="https://github.com" /></div></div><div class="profile-grid"><div><label for="glossarySource">来源词</label><input id="glossarySource" type="text" placeholder="repository" /></div><div><label for="glossaryTarget">目标词</label><input id="glossaryTarget" type="text" placeholder="仓库" /></div></div><label><input id="glossaryCaseSensitive" type="checkbox" /> 区分大小写</label><label><input id="glossaryEnabled" type="checkbox" checked /> 启用</label><div class="actions"><button id="saveGlossaryEntry" class="primary">保存术语</button><button id="clearGlossaryEditor">清空编辑器</button></div><div id="glossaryList" class="site-list">正在读取术语表…</div></section>
<section><h2>缓存</h2><label for="cacheMaxMB">缓存软上限（MB）</label><input id="cacheMaxMB" type="number" min="20" max="2048" step="10" value="200" /><div id="cacheStats" class="cache-card">正在读取缓存统计…</div><div class="actions"><button id="refreshCache">刷新统计</button><button id="pruneCache">按上限立即清理</button><button id="clearAllCache" class="danger">清空全部翻译缓存</button></div></section>
<section><h2>自动翻译站点</h2><div id="autoSitesList" class="site-list">正在读取已授权站点…</div><div class="actions"><button id="refreshAutoSites">刷新站点列表</button></div></section>
<div class="sticky-actions"><button id="save" class="primary">保存全局设置</button><button id="test">测试当前默认 Provider</button></div><div id="status" class="status"></div>
</main><script type="module" src="options.js"></script></body></html>
