name: task-253-handoff-acceptance

on:
  push:
    branches:
      - handoff/253-ui-localization-progress

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main and resolve the audited overlap
        run: |
          git config user.name "TranslateFlow CI"
          git config user.email "ci@translateflow.invalid"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Current main already integrated."
            exit 0
          fi
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n'               src/content/reading-page-markers.js               src/content/reading-record.js               src/content/reading-return-card.js | sort)"
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --ours src/content/reading-page-markers.js src/content/reading-return-card.js
            git checkout --theirs src/content/reading-record.js
            git add src/content/reading-page-markers.js src/content/reading-return-card.js src/content/reading-record.js
            test -z "$(git diff --name-only --diff-filter=U)"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate classic Reading projections after merge
        run: |
          node scripts/reading-content-classic.mjs
          git add src/content/reading-record.js src/content/reading-source.js
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "merge: integrate main into task 253 handoff"
            git push origin HEAD:handoff/253-ui-localization-progress
          fi
      - run: npx playwright install --with-deps chromium
      - name: Validate
        run: npm run validate
      - name: Check generated Reading projection
        run: node scripts/reading-content-classic.mjs --check
      - name: Build WXT
        run: npm run build:extension:wxt
      - name: WXT smoke
        run: npm run test:wxt:smoke
      - name: Task 253 E2E
        run: >
          npm run test:e2e -- --workers=1 --retries=0
          e2e/ui-locale.spec.mjs
          e2e/ui-redesign.spec.mjs
          e2e/settings-ia.spec.mjs
          e2e/dark-mode.spec.mjs
          e2e/learning-center.spec.mjs
          e2e/reading-loop-release-a.spec.mjs
          e2e/translateflow.spec.mjs
          e2e/subtitles.spec.mjs
      - name: Working tree must remain generated-clean
        run: git diff --check && test -z "$(git status --short)"
