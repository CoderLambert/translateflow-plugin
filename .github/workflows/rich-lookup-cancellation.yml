name: rich-lookup-cancellation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rich-lookup-cancellation.yml"
      - "scripts/measure-rich-lookup-cancellation-baseline.mjs"
      - "e2e/selection-rich-lookup-cancel.spec.mjs"
      - "tests/helpers/rich-mdict-fixture.mjs"
      - "tests/rich-mdict-lookup-cancellation.test.mjs"
      - "src/content/selection/**"
      - "src/background/router.js"
      - "src/background/packs/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/rich-lookup-cancellation.yml"
      - "scripts/measure-rich-lookup-cancellation-baseline.mjs"
      - "e2e/selection-rich-lookup-cancel.spec.mjs"
      - "tests/helpers/rich-mdict-fixture.mjs"
      - "tests/rich-mdict-lookup-cancellation.test.mjs"
      - "src/content/selection/**"
      - "src/background/router.js"
      - "src/background/packs/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  verify:
    name: Rich lookup cancellation and retained evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"

      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: Generate pinned-main raw baseline samples
        env:
          DICTIONARY_ECOSYSTEM_V2_EVIDENCE_DIR: ${{ runner.temp }}/rich-lookup-cancellation-evidence
        run: node scripts/measure-rich-lookup-cancellation-baseline.mjs

      - name: Build the selected stage-one production artifact
        run: npm run build:extension

      - name: Verify SPA cancellation and bounded range cancellation
        env:
          CI: "true"
          TF_E2E_ARTIFACT: dist/extension
          TF_E2E_ARTIFACT_SOURCE_HEAD: ${{ github.sha }}
          DICTIONARY_ECOSYSTEM_V2_EVIDENCE_DIR: ${{ runner.temp }}/rich-lookup-cancellation-evidence
        run: npx playwright test e2e/selection-rich-lookup-cancel.spec.mjs --reporter=line

      - name: Retain sanitized cancellation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rich-lookup-cancellation-evidence
          path: |
            ${{ runner.temp }}/rich-lookup-cancellation-evidence/rich-lookup-cancellation-baseline.json
            ${{ runner.temp }}/rich-lookup-cancellation-evidence/rich-lookup-cancellation-report.json
          if-no-files-found: error
          retention-days: 30
