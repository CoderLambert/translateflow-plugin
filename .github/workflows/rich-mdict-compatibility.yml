name: rich-mdict-compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rich-mdict-compatibility.yml"
      - "lexicon/build-evidence/ecdict-mdx-1.0.28-corpus-lock.json"
      - "scripts/certify-rich-mdict-corpus.mjs"
      - "package.json"
      - "manifest.json"
      - "options.html"
      - "scripts/build-extension.mjs"
      - "src/background/packs/**"
      - "src/background/router.js"
      - "src/shared/constants.js"
      - "src/options/rich-mdict-*.js"
      - "src/options/workers/rich-mdict-*.js"
      - "src/content/selection/**"
      - "src/content/ui/selection-lexical-styles.js"
      - "e2e/rich-mdict*.spec.mjs"
      - "e2e/rich-viewer-security.spec.mjs"
      - "e2e/support/extension-fixture.mjs"
      - "tests/rich-mdict*.test.mjs"
      - "tests/rich-dictionary-sanitizer.test.mjs"
      - "tests/rich-viewer-contract.test.mjs"
      - "tests/helpers/rich-viewer-security-fixture.mjs"
      - "tests/helpers/rich-mdict-fixture.mjs"
      - "docs/RICH_MDICT_EVIDENCE.md"
  pull_request:
    paths:
      - ".github/workflows/rich-mdict-compatibility.yml"
      - "lexicon/build-evidence/ecdict-mdx-1.0.28-corpus-lock.json"
      - "scripts/certify-rich-mdict-corpus.mjs"
      - "package.json"
      - "manifest.json"
      - "options.html"
      - "scripts/build-extension.mjs"
      - "src/background/packs/**"
      - "src/background/router.js"
      - "src/shared/constants.js"
      - "src/options/rich-mdict-*.js"
      - "src/options/workers/rich-mdict-*.js"
      - "src/content/selection/**"
      - "src/content/ui/selection-lexical-styles.js"
      - "e2e/rich-mdict*.spec.mjs"
      - "e2e/rich-viewer-security.spec.mjs"
      - "e2e/support/extension-fixture.mjs"
      - "tests/rich-mdict*.test.mjs"
      - "tests/rich-dictionary-sanitizer.test.mjs"
      - "tests/rich-viewer-contract.test.mjs"
      - "tests/helpers/rich-viewer-security-fixture.mjs"
      - "tests/helpers/rich-mdict-fixture.mjs"
      - "docs/RICH_MDICT_EVIDENCE.md"

permissions:
  contents: read

jobs:
  real-ecdict:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Download and verify pinned upstream MDX
        run: node scripts/certify-rich-mdict-corpus.mjs
        env:
          RICH_MDICT_CACHE_DIR: ${{ runner.temp }}/translateflow-rich-mdict
          RICH_MDICT_EVIDENCE_DIR: ${{ runner.temp }}/translateflow-rich-mdict/evidence
      - name: Run MDict parser and sanitizer security tests
        run: node --test tests/rich-mdict-security.test.mjs tests/rich-dictionary-sanitizer.test.mjs tests/rich-viewer-contract.test.mjs
      - name: Run real ECDICT and hostile rich-viewer browser gates
        run: npx playwright test e2e/rich-mdict-product.spec.mjs e2e/rich-mdict-real-corpus.spec.mjs e2e/rich-viewer-security.spec.mjs
        env:
          RICH_MDICT_REAL_MDX: ${{ runner.temp }}/translateflow-rich-mdict/简明英汉字典增强版.mdx
          RICH_MDICT_EVIDENCE_DIR: ${{ runner.temp }}/translateflow-rich-mdict/evidence
      - name: Upload reports and screenshots (never the corpus asset)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rich-mdict-ecdict-evidence
          path: ${{ runner.temp }}/translateflow-rich-mdict/evidence
          if-no-files-found: ignore
          retention-days: 30
