name: rich-mdict-compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-ecdict:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Download and verify pinned upstream MDX
        run: node scripts/certify-rich-mdict-corpus.mjs
        env:
          RICH_MDICT_CACHE_DIR: ${{ runner.temp }}/translateflow-rich-mdict
          RICH_MDICT_EVIDENCE_DIR: ${{ runner.temp }}/translateflow-rich-mdict/evidence
      - name: Run MDict parser and sanitizer security tests
        run: node --test tests/rich-mdict-security.test.mjs tests/rich-dictionary-sanitizer.test.mjs tests/rich-viewer-contract.test.mjs
      - name: Build the selected stage-one production artifact
        run: npm run build:extension
      - name: Run real ECDICT, local preflight, and hostile rich-viewer gates
        run: npx playwright test e2e/rich-mdict-product.spec.mjs e2e/rich-mdict-real-corpus.spec.mjs e2e/local-dictionary-preflight-real-ecdict.spec.mjs e2e/curated-ecdict-mdx-product.spec.mjs e2e/rich-viewer-security.spec.mjs
        env:
          TF_E2E_ARTIFACT: dist/extension
          TF_E2E_ARTIFACT_SOURCE_HEAD: ${{ github.sha }}
          RICH_MDICT_REAL_MDX: ${{ runner.temp }}/translateflow-rich-mdict/简明英汉字典增强版.mdx
          RICH_MDICT_CACHE_DIR: ${{ runner.temp }}/translateflow-rich-mdict
          ECDICT_MDX_ONE_CLICK_GATE: "1"
          RICH_MDICT_EVIDENCE_DIR: ${{ runner.temp }}/translateflow-rich-mdict/evidence
      - name: Upload reports and screenshots (never the corpus asset)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rich-mdict-ecdict-evidence
          path: ${{ runner.temp }}/translateflow-rich-mdict/evidence
          if-no-files-found: ignore
          retention-days: 30
