name: e2e

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "manifest.json"
      - "background.js"
      - "content.js"
      - "content.css"
      - "popup.*"
      - "options.*"
      - "src/**"
      - "e2e/**"
      - "playwright.config.mjs"
      - "entrypoints/**"
      - "wxt.config.mjs"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "tests/unit/**"
      - "scripts/check.mjs"
      - "scripts/source-boundaries.mjs"
      - "scripts/*wxt*.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"
      - "docs/DICTIONARY_SOURCE_FREEZE.md"

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build:extension:wxt
      - run: npm run test:wxt:smoke
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
