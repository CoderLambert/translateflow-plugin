name: dictionary-library-vnext-certification

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact main SHA used as the frozen Dictionary Ecosystem v2 scope base
        required: true
        type: string

permissions:
  contents: read

jobs:
  certify:
    name: Dictionary Library vNext final certification
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout locked Open Multilingual Wordnet source
        uses: actions/checkout@v4
        with:
          repository: omwn/omw-data
          ref: 406bf83b3c507a3d1f26e88252d5d66893fd36bf
          path: .release-sources/omw-data
          sparse-checkout: |
            wns/eng/wn-data-eng.tab
            wns/cow/wn-data-cmn.tab
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout locked WordNet 3.0 sense index
        uses: actions/checkout@v4
        with:
          repository: nltk/wordnet
          ref: ce91915ae38a341ae845be4d825ef6003cddf395
          path: .release-sources/wordnet
          sparse-checkout: |
            wn/data/wordnet-3.0/index.sense
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and prepare bounded evidence directories
        run: |
          npm ci --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/translateflow-vnext/cache" "$RUNNER_TEMP/translateflow-vnext/evidence-private" "$RUNNER_TEMP/translateflow-vnext/evidence-published" "$RUNNER_TEMP/translateflow-vnext/mdd-work" "$RUNNER_TEMP/writemdict"
          node -e 'process.stdout.write(String(Date.now()))' > "$RUNNER_TEMP/translateflow-vnext/evidence-private/run-started-at-ms"

      - name: Rebuild the locked Core and Technical lexical lane
        run: npm run setup:lexicon

      - name: Validate source packs and run all unit checks
        run: npm run validate

      - name: Run focused active Rich lookup range and decode cancellation tests
        if: ${{ hashFiles('tests/rich-mdict-lookup-cancellation.test.mjs') != '' }}
        run: npm run test:rich-lookup-cancellation

      - name: Report the required pending #224 cancellation follow-up
        if: ${{ hashFiles('tests/rich-mdict-lookup-cancellation.test.mjs') == '' }}
        run: echo "Focused #224 cancellation tests are pending the required runtime slice; the final ecosystem gate remains disabled until that slice is shipped."

      - name: Fetch locked independent MDict writer source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/writemdict"
          git -C "$RUNNER_TEMP/writemdict" init
          git -C "$RUNNER_TEMP/writemdict" remote add origin https://github.com/zhansliu/writemdict.git
          git -C "$RUNNER_TEMP/writemdict" fetch --depth=1 origin f0240b30cabd2f0470d3ee1a0641fc7f8c38dcf5
          git -C "$RUNNER_TEMP/writemdict" checkout --detach FETCH_HEAD

      - name: Download, verify, and measure pinned ECDICT MDX ranges
        run: node scripts/certify-rich-mdict-corpus.mjs
        env:
          RICH_MDICT_CACHE_DIR: ${{ runner.temp }}/translateflow-vnext/cache
          RICH_MDICT_EVIDENCE_DIR: ${{ runner.temp }}/translateflow-vnext/evidence-private

      - name: Regenerate independent MDD evidence and measure the 100 MiB range case
        run: node scripts/certify-mdd-interop.mjs --writer-checkout "$RUNNER_TEMP/writemdict" --regenerate --large-range-evidence --bulk-bytes 104857600 --out "$RUNNER_TEMP/translateflow-vnext/evidence-private/mdd-interop-certification.json"
        env:
          MDD_INTEROP_EVIDENCE_DIR: ${{ runner.temp }}/translateflow-vnext/mdd-work

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate pinned #224 cancellation baseline evidence
        if: ${{ hashFiles('scripts/measure-rich-lookup-cancellation-baseline.mjs') != '' }}
        run: node scripts/measure-rich-lookup-cancellation-baseline.mjs
        env:
          DICTIONARY_ECOSYSTEM_V2_EVIDENCE_DIR: ${{ runner.temp }}/translateflow-vnext/evidence-private

      - name: Run focused Dictionary Library vNext product E2E gates
        shell: bash
        run: |
          test_paths=(
          e2e/rich-mdict-real-corpus.spec.mjs
          e2e/rich-mdict-product.spec.mjs
          e2e/mdd-resources.spec.mjs
          e2e/multi-dictionary-viewer.spec.mjs
          e2e/settings-ia.spec.mjs
          e2e/rich-viewer-security.spec.mjs
          e2e/release-lexicon.spec.mjs
          e2e/dictionary-library-vnext-product.spec.mjs
          e2e/dictionary-library-v2-product.spec.mjs
          e2e/local-dictionary-import-v2-product.spec.mjs
          e2e/local-dictionary-preflight-real-ecdict.spec.mjs
          e2e/mdict-import-product.spec.mjs
          e2e/stardict-import-product.spec.mjs
          e2e/dictionary-ecosystem-v2-release.spec.mjs
          )
          if [[ -f e2e/selection-rich-lookup-cancel.spec.mjs ]]; then
            test_paths+=(e2e/selection-rich-lookup-cancel.spec.mjs)
          fi
          npx playwright test "${test_paths[@]}" --reporter=line,json --output="$RUNNER_TEMP/translateflow-vnext/playwright-results"
        env:
          CI: "true"
          TF_E2E_ARTIFACT: dist/extension
          TF_E2E_ARTIFACT_SOURCE_HEAD: ${{ github.sha }}
          TF_I18N_ARTIFACT: dist/extension
          ECDICT_MDX_ONE_CLICK_GATE: "1"
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/translateflow-vnext/evidence-private/playwright-vnext-report.json
          RICH_MDICT_CACHE_DIR: ${{ runner.temp }}/translateflow-vnext/cache
          RICH_MDICT_REAL_MDX: ${{ runner.temp }}/translateflow-vnext/cache/简明英汉字典增强版.mdx
          RICH_MDICT_EVIDENCE_DIR: ${{ runner.temp }}/translateflow-vnext/evidence-private
          MDD_INTEROP_EVIDENCE_DIR: ${{ runner.temp }}/translateflow-vnext/evidence-private
          DICTIONARY_LIBRARY_VNEXT_EVIDENCE_DIR: ${{ runner.temp }}/translateflow-vnext/evidence-private
          DICTIONARY_ECOSYSTEM_V2_EVIDENCE_DIR: ${{ runner.temp }}/translateflow-vnext/evidence-private

      - name: Certify all fresh product, package, and lexical-primary evidence
        run: npm run certify:dictionary-library-vnext -- --evidence-dir "$RUNNER_TEMP/translateflow-vnext/evidence-private" --out "$RUNNER_TEMP/translateflow-vnext/evidence-published/dictionary-library-vnext-certification.json"

      - name: Check whether the frozen ecosystem scope is ready for final certification
        id: ecosystem-scope
        run: |
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const scope = JSON.parse(await readFile("docs/DICTIONARY_ECOSYSTEM_V2_RELEASE_SCOPE.json", "utf8"));
            const required = [199, 200, 202, 215, 203, 204, 224];
            const slices = new Map((scope.requiredSlices || []).map((item) => [item.issue, item.status]));
            const ready = scope.scopeStatus === "frozen-for-certification" &&
              scope.scopeRevision?.issue === 224 && scope.scopeRevision?.status === "shipped" &&
              required.every((issue) => slices.get(issue) === (issue === 215 ? "shipped-through-203" : "shipped"));
            process.stdout.write(`ready=${ready ? "true" : "false"}\n`);
          ' >> "$GITHUB_OUTPUT"

      - name: Report the required pending follow-up before final certification
        if: steps.ecosystem-scope.outputs.ready != 'true'
        run: echo "Dictionary Ecosystem v2 final certification is not yet ready; the frozen scope still has a required pending slice. This workflow run performs its vNext sub-certification only."

      - name: Resolve the frozen certification base from the trusted event base
        id: ecosystem-base
        if: steps.ecosystem-scope.outputs.ready == 'true'
        run: node scripts/resolve-ecosystem-certification-base.mjs
        env:
          ECOSYSTEM_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          ECOSYSTEM_MANUAL_BASE_SHA: ${{ inputs.base_sha }}

      - name: Certify frozen Dictionary Ecosystem v2 release scope and evidence
        if: steps.ecosystem-scope.outputs.ready == 'true'
        run: >-
          npm run certify:dictionary-ecosystem-v2 --
          --evidence-dir "$RUNNER_TEMP/translateflow-vnext/evidence-private"
          --vnext-report "$RUNNER_TEMP/translateflow-vnext/evidence-published/dictionary-library-vnext-certification.json"
          --run-marker "$RUNNER_TEMP/translateflow-vnext/evidence-private/run-started-at-ms"
          --base-sha "$DICTIONARY_ECOSYSTEM_V2_BASE_SHA"
          --out "$RUNNER_TEMP/translateflow-vnext/evidence-published/dictionary-ecosystem-v2-certification.json"
        env:
          DICTIONARY_ECOSYSTEM_V2_BASE_SHA: ${{ steps.ecosystem-base.outputs.base_sha }}

      - name: Upload sanitized dictionary certification summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-ecosystem-v2-certification
          path: |
            ${{ runner.temp }}/translateflow-vnext/evidence-published/dictionary-library-vnext-certification.json
            ${{ runner.temp }}/translateflow-vnext/evidence-published/dictionary-ecosystem-v2-certification.json
          if-no-files-found: ignore
          retention-days: 30
