name: Free MT build inputs
on:
  push:
    branches: [feat/free-online-mt-20261016]
    paths: [.github/workflows/free-mt-build-inputs.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npx playwright install chromium
      - name: Export public browser and npm runtime
        run: |
          mkdir -p "$RUNNER_TEMP/mt-browser"
          tar -czf "$RUNNER_TEMP/mt-browser/chromium.tar.gz" -C "$HOME/.cache/ms-playwright" .
          tar -czf "$RUNNER_TEMP/mt-browser/npm.tar.gz" -C "$(npm root -g)" npm
          sha256sum "$RUNNER_TEMP/mt-browser/"* > "$RUNNER_TEMP/mt-browser/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: free-mt-browser
          path: ${{ runner.temp }}/mt-browser/
          retention-days: 1
          compression-level: 0
