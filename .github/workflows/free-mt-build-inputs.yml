name: Free MT candidate synchronization
on:
  push:
    branches: [feat/free-online-mt-20261016]
    paths: [.github/workflows/free-mt-build-inputs.yml]
permissions:
  contents: write
concurrency:
  group: free-mt-candidate-synchronization
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Apply checksum-verified source and verify tested tree
        shell: bash
        run: |
          set -euo pipefail
          cat .github/mt-parts/{00,01,02,03,04,05,06,07,08,09}.txt | base64 --decode > "$RUNNER_TEMP/mt.patch.xz"
          echo "24fd58d6c106c27b2af4952607f7f8725d8a01b61f9a6793e9f9fef2a39ecba2  $RUNNER_TEMP/mt.patch.xz" | sha256sum --check
          xz --decompress --stdout "$RUNNER_TEMP/mt.patch.xz" > "$RUNNER_TEMP/mt.patch"
          git apply --check --unidiff-zero "$RUNNER_TEMP/mt.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/mt.patch"
          node scripts/reading-content-classic.mjs
          rm .github/mt-parts/{00,01,02,03,04,05,06,07,08,09}.txt
          rmdir .github/mt-parts
          cp .github/workflows/free-mt-build-inputs.yml "$RUNNER_TEMP/mt-sync-workflow.yml"
          rm .github/workflows/free-mt-build-inputs.yml
          git add -A
          candidate_tree="$(git write-tree)"
          echo "Verified candidate tree: $candidate_tree"
          test "$candidate_tree" = 291dd7d87c669f7356bbb7730b12a81c6eda7b99
          mkdir -p "$RUNNER_TEMP/mt-result"
          printf '%s\n' "$candidate_tree" > "$RUNNER_TEMP/mt-result/tested-tree.txt"
          # The connector removes this temporary workflow after synchronization.
          # Leave its exact bytes untouched in the token-authenticated push.
          cp "$RUNNER_TEMP/mt-sync-workflow.yml" .github/workflows/free-mt-build-inputs.yml
          git add .github/workflows/free-mt-build-inputs.yml
      - name: Commit through the repository version/build hook and push the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.hooksPath .githooks
          TERM=dumb git commit -m 'feat: add opt-in free Microsoft and Tencent machine translation'
          git push origin HEAD:refs/heads/feat/free-online-mt-20261016
          git rev-parse HEAD > "$RUNNER_TEMP/mt-result/sync-head.txt"
          git status --short > "$RUNNER_TEMP/mt-result/status.txt"
      - name: Probe fixed public sample through the actual adapters
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { createMachineConfig } from './src/shared/machine-translation.js';
          import { translateMachineBatch } from './src/background/providers/machine-translation.js';
          const results = [];
          for (const providerId of ['mt-microsoft-web', 'mt-tencent-transmart']) {
            const start = Date.now();
            try {
              const config = createMachineConfig({ version: 1, mode: 'free-online', providerId, sourceLanguage: 'en' }, 'zh');
              const translations = await translateMachineBatch([{ id: 'public-probe', text: 'This is a translation connection test.' }], config, { signal: AbortSignal.timeout(20000) });
              results.push({ providerId, status: 'PASS', elapsedMs: Date.now() - start, translations });
            } catch (error) {
              results.push({ providerId, status: 'FAIL', elapsedMs: Date.now() - start, errorCode: error?.code || 'UNKNOWN', httpStatus: error?.status || 0 });
            }
          }
          const report = { observedAt: new Date().toISOString(), environment: 'GitHub hosted Linux runner, Node; not an extension or the user network', scope: 'One fixed non-personal sentence per provider; no keys, login, fallback or retries', results };
          await writeFile(`${process.env.RUNNER_TEMP}/mt-result/live-probe.json`, JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-mt-source-sync-result
          path: ${{ runner.temp }}/mt-result/
          retention-days: 1
