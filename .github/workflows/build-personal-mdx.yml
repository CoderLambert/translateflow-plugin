name: build-personal-mdx

on:
  push:
    branches:
      - tooling/personal-mdx-dictionary-v1
    paths:
      - "tools/personal-mdx/**"
      - ".github/workflows/build-personal-mdx.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MDict writer
        run: |
          python -m pip install --disable-pip-version-check "mdict-utils==1.3.14" "opencc-python-reimplemented==0.1.7"

      - name: Download source dictionaries and examples
        run: |
          set -euxo pipefail
          mkdir -p .personal-mdx/sources
          curl --fail --location --retry 4 \
            "https://raw.githubusercontent.com/skywind3000/ECDICT/master/ecdict.csv" \
            -o .personal-mdx/sources/ecdict.csv
          curl --fail --location --retry 4 \
            "https://downloads.tatoeba.org/exports/per_language/eng/eng_sentences.tsv.bz2" \
            -o .personal-mdx/sources/eng_sentences.tsv.bz2
          curl --fail --location --retry 4 \
            "https://downloads.tatoeba.org/exports/per_language/cmn/cmn_sentences.tsv.bz2" \
            -o .personal-mdx/sources/cmn_sentences.tsv.bz2
          curl --fail --location --retry 4 \
            "https://downloads.tatoeba.org/exports/per_language/eng/eng-cmn_links.tsv.bz2" \
            -o .personal-mdx/sources/eng-cmn_links.tsv.bz2
          ls -lh .personal-mdx/sources

      - name: Project rich dictionary source
        run: |
          set -euxo pipefail
          mkdir -p .personal-mdx/build/resources .personal-mdx/build/meta .personal-mdx/dist
          python tools/personal-mdx/build_dictionary.py \
            --ecdict .personal-mdx/sources/ecdict.csv \
            --eng-sentences .personal-mdx/sources/eng_sentences.tsv.bz2 \
            --cmn-sentences .personal-mdx/sources/cmn_sentences.tsv.bz2 \
            --links .personal-mdx/sources/eng-cmn_links.tsv.bz2 \
            --source-out .personal-mdx/build/dictionary.txt \
            --resource-dir .personal-mdx/build/resources \
            --metadata-dir .personal-mdx/build/meta \
            --example-headwords 50000 \
            --max-examples 2
          cat .personal-mdx/build/meta/build-report.json
          du -h .personal-mdx/build/dictionary.txt

      - name: Pack MDX and MDD
        run: |
          set -euxo pipefail
          mdict \
            --title .personal-mdx/build/meta/title.html \
            --description .personal-mdx/build/meta/description.html \
            -a .personal-mdx/build/dictionary.txt \
            .personal-mdx/dist/TranslateFlow-Personal-English-Chinese-v1.mdx
          mdict \
            --title .personal-mdx/build/meta/title.html \
            --description .personal-mdx/build/meta/description.html \
            -a .personal-mdx/build/resources \
            .personal-mdx/dist/TranslateFlow-Personal-English-Chinese-v1.mdd
          cp .personal-mdx/build/meta/build-report.json .personal-mdx/dist/
          ls -lh .personal-mdx/dist

      - name: Smoke-test MDX
        run: |
          set -euxo pipefail
          mdict -m .personal-mdx/dist/TranslateFlow-Personal-English-Chinese-v1.mdx
          for word in development adaptation used went written teeth persistent; do
            echo "===== $word ====="
            mdict -q "$word" .personal-mdx/dist/TranslateFlow-Personal-English-Chinese-v1.mdx | head -c 6000 || true
            echo
          done
          test -s .personal-mdx/dist/TranslateFlow-Personal-English-Chinese-v1.mdx
          test -s .personal-mdx/dist/TranslateFlow-Personal-English-Chinese-v1.mdd

      - name: Upload personal dictionary artifact
        uses: actions/upload-artifact@v4
        with:
          name: TranslateFlow-Personal-English-Chinese-v1
          path: .personal-mdx/dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
