name: lexicon-release

on:
  push:
    branches: [main]
    paths:
      - "src/background/lexical/**"
      - "scripts/build-tflex-*.mjs"
      - "scripts/project-*-import.mjs"
      - "tests/*-import*.test.mjs"
      - "scripts/build-release-lexicon.mjs"
      - "scripts/setup-lexicon.mjs"
      - "scripts/certify-lexical-release.mjs"
      - "scripts/certify-integrated-lexical-quality.mjs"
      - "scripts/certify-offline-dictionary-beta.mjs"
      - "scripts/benchmark-lexical-quality.mjs"
      - "scripts/evaluate-core-bootstrap.mjs"
      - "scripts/measure-extension-footprint.mjs"
      - "scripts/measure-stardict-import-cost.mjs"
      - "tests/fixtures/lexical-quality-v1.json"
      - "tests/fixtures/ordinary-browsing-v1.json"
      - "tests/offline-dictionary-beta-certification.test.mjs"
      - "docs/OFFLINE_DICTIONARY_BETA_CERTIFICATION.md"
      - "lexicon/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/lexicon-release.yml"
  pull_request:
    paths:
      - "src/background/lexical/**"
      - "scripts/build-tflex-*.mjs"
      - "scripts/project-*-import.mjs"
      - "tests/*-import*.test.mjs"
      - "scripts/build-release-lexicon.mjs"
      - "scripts/setup-lexicon.mjs"
      - "scripts/certify-lexical-release.mjs"
      - "scripts/certify-integrated-lexical-quality.mjs"
      - "scripts/certify-offline-dictionary-beta.mjs"
      - "scripts/benchmark-lexical-quality.mjs"
      - "scripts/evaluate-core-bootstrap.mjs"
      - "scripts/measure-extension-footprint.mjs"
      - "scripts/measure-stardict-import-cost.mjs"
      - "tests/fixtures/lexical-quality-v1.json"
      - "tests/fixtures/ordinary-browsing-v1.json"
      - "tests/offline-dictionary-beta-certification.test.mjs"
      - "lexicon/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/lexicon-release.yml"
      - "docs/DICTIONARY_SOURCE_FREEZE.md"
      - "docs/OFFLINE_DICTIONARY_BETA_CERTIFICATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout locked OMW source
        uses: actions/checkout@v4
        with:
          repository: omwn/omw-data
          ref: 406bf83b3c507a3d1f26e88252d5d66893fd36bf
          path: .release-sources/omw-data
          sparse-checkout: |
            wns/eng/wn-data-eng.tab
            wns/cow/wn-data-cmn.tab
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout locked WordNet 3.0 sense index
        uses: actions/checkout@v4
        with:
          repository: nltk/wordnet
          ref: ce91915ae38a341ae845be4d825ef6003cddf395
          path: .release-sources/wordnet
          sparse-checkout: |
            wn/data/wordnet-3.0/index.sense
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"

      - run: npm ci --no-audit --no-fund

      - name: Bootstrap locked release lexical packs
        run: npm run setup:lexicon

      - name: Record lexical quality baseline
        run: npm run benchmark:lexical -- --out lexical-quality-report.json

      - name: Evaluate source-derived Core bootstrap profiles
        run: npm run evaluate:bootstrap -- --out core-bootstrap-evaluation.json

      - name: Measure production extension footprint cost
        run: npm run measure:extension-footprint -- --out extension-footprint-report.json

      - name: Measure shared StarDict import cost baseline
        run: npm run measure:stardict-import -- --out stardict-import-cost-report.json

      - name: Certify integrated Selection lexical quality
        run: >-
          npm run certify:selection-lexical --
          --quality lexical-quality-report.json
          --bootstrap core-bootstrap-evaluation.json
          --footprint extension-footprint-report.json
          --out integrated-lexical-certification.json

      - name: Re-certify real release packs
        run: npm run certify:lexicon

      - name: Validate generated release tree
        run: npm run validate

      - run: npx playwright install --with-deps chromium

      - name: Chromium E2E with real release packs
        env:
          REQUIRE_RELEASE_LEXICON_PACKS: "1"
          TF_I18N_ARTIFACT: dist/extension
          PLAYWRIGHT_JSON_OUTPUT_FILE: offline-dictionary-beta-e2e.json
        run: npm run test:e2e -- --reporter=line,json

      - name: Certify integrated Offline Dictionary Library Beta
        run: >-
          npm run certify:offline-dictionary-beta --
          --e2e offline-dictionary-beta-e2e.json
          --lexical integrated-lexical-certification.json
          --footprint extension-footprint-report.json
          --out offline-dictionary-beta-certification.json

      - name: Upload lexical quality report
        uses: actions/upload-artifact@v4
        with:
          name: lexical-quality-report
          path: lexical-quality-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Core bootstrap evaluation
        uses: actions/upload-artifact@v4
        with:
          name: core-bootstrap-evaluation
          path: core-bootstrap-evaluation.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload extension footprint report
        uses: actions/upload-artifact@v4
        with:
          name: extension-footprint-report
          path: extension-footprint-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload integrated lexical certification
        uses: actions/upload-artifact@v4
        with:
          name: integrated-lexical-certification
          path: integrated-lexical-certification.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload StarDict import cost baseline
        uses: actions/upload-artifact@v4
        with:
          name: stardict-import-cost-report
          path: stardict-import-cost-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload release lexical packs
        uses: actions/upload-artifact@v4
        with:
          name: release-lexicon-packs
          path: assets/lexicon/
          if-no-files-found: error
          retention-days: 7

      - name: Upload integrated Offline Dictionary Beta certification
        uses: actions/upload-artifact@v4
        with:
          name: offline-dictionary-beta-certification
          path: |
            offline-dictionary-beta-certification.json
            offline-dictionary-beta-e2e.json
            integrated-lexical-certification.json
            extension-footprint-report.json
          if-no-files-found: error
          retention-days: 30
