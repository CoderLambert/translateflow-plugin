name: reading-fix-temporary-verify

on:
  push:
    branches:
      - fix/reading-invalidation-retry-20261004

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - run: npm ci --no-audit --no-fund
      - name: Remove temporary workflow from validation tree
        run: rm .github/workflows/reading-fix-temporary-verify.yml
      - run: npx playwright install --with-deps chromium
      - run: npm run build:extension:wxt
      - name: Run page markers E2E
        id: page_markers
        continue-on-error: true
        run: npm run test:e2e -- --workers=1 --retries=0 e2e/reading-page-markers.spec.mjs
      - name: Upload page markers failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-page-markers-debug-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 1
      - name: Fail on page markers regression
        if: steps.page_markers.outcome == 'failure'
        run: exit 1
