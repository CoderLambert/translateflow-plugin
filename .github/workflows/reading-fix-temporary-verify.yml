name: reading-fix-temporary-verify

on:
  push:
    branches:
      - fix/reading-invalidation-retry-20261004

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - run: npm ci --no-audit --no-fund
      - run: npm run validate
      - run: node scripts/reading-content-classic.mjs --check
      - run: node --test tests/reading-anchor-resolver.test.mjs
      - run: npm run build:extension:wxt
      - run: npm run test:wxt:smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1 e2e/reading-return-location.spec.mjs e2e/reading-page-markers.spec.mjs
