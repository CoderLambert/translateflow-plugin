<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TranslateFlow</title>
  <link rel="stylesheet" href="src/ui/styles/tokens.css" />
  <link rel="stylesheet" href="src/ui/styles/components.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup-shell">
    <header class="popup-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">译</div>
        <div class="brand-copy">
          <strong>TranslateFlow</strong>
          <span>安静地翻译当前网页</span>
        </div>
      </div>
      <div class="header-actions">
        <span class="ready-badge"><span aria-hidden="true"></span>就绪</span>
        <button id="settings" class="icon-btn" aria-label="打开高级设置" title="高级设置">⚙</button>
      </div>
    </header>

    <section id="effectiveContext" class="page-card" hidden aria-label="当前翻译配置">
      <div class="page-card-head">
        <div class="site-icon" aria-hidden="true">🌐</div>
        <div class="site-copy">
          <span class="section-kicker">当前页面</span>
          <strong id="contextSite">—</strong>
        </div>
      </div>
      <div class="context-grid">
        <span>翻译模式</span><strong id="contextMode">—</strong>
        <span>模型服务</span><strong><span id="contextProvider">—</span> · <span id="contextModel">—</span></strong>
      </div>
    </section>

    <section class="primary-section" aria-label="页面翻译">
      <button id="translate" class="tf-button tf-button--primary primary-action">翻译当前页面</button>
      <button id="cancelTask" class="tf-button cancel-task" hidden>取消当前翻译</button>
      <div id="status" class="status-banner" role="status" aria-live="polite">准备就绪</div>
    </section>

    <section class="control-card tf-card" aria-label="页面偏好">
      <div class="control-row">
        <div class="control-copy">
          <strong>自动翻译</strong>
          <div id="autoInfo" class="supporting">正在检查本站设置…</div>
        </div>
        <button id="autoSite" class="toggle-button" role="switch" aria-checked="false" aria-label="切换本站自动翻译" disabled>
          <span class="toggle-track" aria-hidden="true"></span>
        </button>
      </div>

      <label class="field-row" for="appearanceSelect">
        <span class="control-copy"><strong>阅读外观</strong><small>仅调整译文排版，不改变翻译结果</small></span>
        <select id="appearanceSelect" class="tf-select appearance-select" aria-label="本站阅读外观"></select>
      </label>
    </section>

    <details class="secondary-card tf-accordion">
      <summary>翻译模式与页面控制</summary>
      <div class="secondary-content">
        <label class="preset-label" for="presetSelect">翻译模式</label>
        <select id="presetSelect" class="tf-select"></select>
        <div class="row preset-actions">
          <button id="applyPreset" class="tf-button tf-button--secondary">临时应用</button>
          <button id="savePreset" class="tf-button tf-button--secondary">保存到本站</button>
        </div>
        <div id="presetHint" class="preset-hint"></div>
        <div class="row maintenance-actions">
          <button id="toggle" class="tf-button tf-button--ghost">显示 / 隐藏译文</button>
          <button id="clear" class="tf-button tf-button--ghost">移除页面译文</button>
        </div>
      </div>
    </details>

    <details class="secondary-card tf-accordion">
      <summary>Quick Control 与缓存</summary>
      <div class="secondary-content stacked-actions">
        <div class="setting-block">
          <div id="quickControlInfo" class="supporting">正在检查 Quick Control…</div>
          <button id="quickControlSite" class="tf-button tf-button--secondary quick-btn" disabled>以后在本站自动显示 Quick Control</button>
        </div>

        <div class="setting-block">
          <div id="cacheRestoreInfo" class="supporting">正在检查自动缓存恢复…</div>
          <button id="cacheRestoreSite" class="tf-button tf-button--secondary quick-btn" disabled>以后进入本站自动恢复缓存</button>
        </div>

        <div class="setting-block cache-block">
          <div id="cacheInfo" class="supporting">正在检查本页缓存…</div>
          <button id="restore" class="tf-button tf-button--secondary">仅恢复本页缓存</button>
          <button id="clearCache" class="tf-button danger-lite">删除本页全部缓存版本</button>
        </div>
      </div>
    </details>
  </main>
  <script type="module" src="popup.js"></script>
  <script type="module" src="popup-appearance.js"></script>
</body>
</html>
