<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TranslateFlow</title>
  <link rel="stylesheet" href="src/ui/styles/tokens.css" />
  <link rel="stylesheet" href="src/ui/styles/components.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <header class="popup-header">
      <div>
        <div class="eyebrow">TRANSLATEFLOW</div>
        <div class="title">当前页面</div>
      </div>
      <button id="settings" class="icon-btn" aria-label="打开高级设置" title="高级设置">⚙</button>
    </header>

    <section id="effectiveContext" class="context-card" hidden aria-label="当前翻译配置">
      <div class="site-line">
        <strong id="contextSite">—</strong>
        <span id="status" class="status" role="status" aria-live="polite">准备就绪</span>
      </div>
      <div class="context-grid">
        <span>翻译模式</span><strong id="contextMode">—</strong>
        <span>模型服务</span><strong><span id="contextProvider">—</span> · <span id="contextModel">—</span></strong>
      </div>
    </section>

    <button id="translate" class="primary">翻译 / 更新当前页面</button>
    <button id="cancelTask" class="cancel-task" hidden>取消当前翻译</button>

    <section class="control-card" aria-label="页面偏好">
      <div class="control-row">
        <div>
          <strong>自动翻译</strong>
          <div id="autoInfo" class="supporting">正在检查本站设置…</div>
        </div>
        <button id="autoSite" class="compact-btn auto-btn" disabled>开启</button>
      </div>
      <label class="field-row" for="appearanceSelect">
        <span><strong>阅读外观</strong><small>仅改变译文排版</small></span>
        <select id="appearanceSelect" aria-label="本站阅读外观"></select>
      </label>
    </section>

    <details class="secondary-card">
      <summary>翻译模式与页面控制</summary>
      <div class="secondary-content">
        <label class="preset-label" for="presetSelect">翻译模式</label>
        <select id="presetSelect"></select>
        <div class="row preset-actions">
          <button id="applyPreset">临时应用</button>
          <button id="savePreset">保存到本站</button>
        </div>
        <div id="presetHint" class="preset-hint"></div>
        <div class="row">
          <button id="toggle">显示 / 隐藏译文</button>
          <button id="clear">移除页面译文</button>
        </div>
      </div>
    </details>

    <details class="secondary-card">
      <summary>Quick Control 与缓存</summary>
      <div class="secondary-content">
        <div id="quickControlInfo" class="supporting">正在检查 Quick Control…</div>
        <button id="quickControlSite" class="quick-btn" disabled>以后在本站自动显示 Quick Control</button>
        <div id="cacheRestoreInfo" class="supporting">正在检查自动缓存恢复…</div>
        <button id="cacheRestoreSite" class="quick-btn" disabled>以后进入本站自动恢复缓存</button>
        <div id="cacheInfo" class="supporting">正在检查本页缓存…</div>
        <button id="restore">仅恢复本页缓存（不调用 API）</button>
        <button id="clearCache" class="danger-lite">删除本页全部缓存版本</button>
      </div>
    </details>
  </main>
  <script type="module" src="popup.js"></script>
  <script type="module" src="popup-appearance.js"></script>
</body>
</html>
